name: Java CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLOB_BUILDS_API_TOKEN: ${{ secrets.BLOB_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supreme
          path: target/Supreme.jar

      - name: Upload to Blob Builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BLOB_BUILDS_API_TOKEN != ''
        uses: WalshyDev/blob-builds/gh-action@main
        with:
          project: Supreme
          apiToken: ${{ env.BLOB_BUILDS_API_TOKEN }}
          file: ./target/Supreme.jar
          releaseNotes: ${{ github.event.head_commit.message }}
